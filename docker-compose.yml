services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minfin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: minfin_social
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - minfin_pg_data:/var/lib/postgresql/data

  wp_mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
    volumes:
      - minfin_wp_mysql_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.3-php8.3-apache
    restart: unless-stopped
    depends_on:
      - wp_mysql
    environment:
      WORDPRESS_DB_HOST: wp_mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD}
      WORDPRESS_DEBUG: "1"
    ports:
      # Solo desarrollo local. Producción debe colocar HTTPS en un proxy inverso.
      - "127.0.0.1:8080:80"
    volumes:
      - minfin_wp_data:/var/www/html
      - ./wordpress-plugin/minfin-social-feed:/var/www/html/wp-content/plugins/minfin-social-feed

volumes:
  minfin_pg_data:
  minfin_wp_mysql_data:
  minfin_wp_data:
