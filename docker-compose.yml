services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minfin
      POSTGRES_PASSWORD: minfin
      POSTGRES_DB: minfin_social
    ports:
      - "5432:5432"
    volumes:
      - minfin_pg_data:/var/lib/postgresql/data

volumes:
  minfin_pg_data:
