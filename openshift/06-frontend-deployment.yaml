apiVersion: apps/v1
kind: Deployment
metadata:
  name: minfin-frontend
  labels:
    app: minfin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minfin-frontend
  template:
    metadata:
      labels:
        app: minfin-frontend
    spec:
      imagePullSecrets:
        - name: srv-osnexus01.minfin.gob.gt
      containers:
        - name: frontend
          # nginx.conf hace proxy_pass a minfin-backend:4000 (Service interno)
          # así que la imagen no depende de ningún build-arg por entorno.
          image: srv-osnexus01.minfin.gob.gt:8006/portal-redes-minfin-frontend-img:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /admin
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /admin
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
