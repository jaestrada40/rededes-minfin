server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El logo institucional se guarda como data URL (base64) en el body del
    # PATCH /settings — el default de nginx (1m) lo rechazaba con 413 antes
    # de llegar al backend (que sí acepta hasta 5mb, ver main.ts).
    client_max_body_size 6m;

    # Proxy interno al Service del backend (mismo namespace de OpenShift) —
    # así el frontend llama a rutas relativas y no necesita VITE_API_URL en
    # build-time para apuntar al backend correcto por entorno.
    location ~ ^/(auth|users|audit|settings|feeds|posts|portals|public)(/|$) {
        proxy_pass http://minfin-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La raíz no expone el panel: solo /admin sirve la SPA.
    location = / {
        return 404;
    }

    # try_files con fallback a /index.html dispara un re-match de location
    # (URI reescrita se busca desde cero) y cae en el "location /" de abajo,
    # que devuelve 404 -- por eso /admin también 404eaba. rewrite ... break
    # no re-dispara el matching, sirve index.html dentro de este location.
    location /admin {
        rewrite ^/admin/?.*$ /index.html break;
    }

    location / {
        return 404;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
